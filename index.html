<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Word Counter</h1>
            <p>Type or paste your text below to get an instant word count</p>
        </header>
        
        <main>
            <div class="input-section">
                <textarea 
                    id="textInput" 
                    placeholder="Start typing your text here..."
                    aria-label="Text input for word counting"
                ></textarea>
            </div>
            
            <div class="stats-section">
                <div class="stat-item">
                    <span class="stat-label">Word Count:</span>
                    <span id="wordCount" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Character Count:</span>
                    <span id="charCount" class="stat-value">0</span>
                </div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
